<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="webicon.png">
  <title>welcome to zin</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&display=swap');

    /* page */
    body {
      margin: 0;
      font-family: "Fira Sans", sans-serif;
      font-weight: 500;
      background: linear-gradient(to bottom, #f3e8ff, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 4rem 2rem 2rem; /* more space at the top */
    }

    h1 {
      font-size: 2.5rem;
      font-weight: bold;
      color: #333;
      margin: 0 0 0.5rem 0;
    }

    p.intro {
      max-width: 600px;
      text-align: center;
      font-size: 1.1rem;
      color: #555;
      margin-bottom: 2rem;
    }

    /* masonry using CSS columns (2 columns on wide screens) */
    .grid {
      column-count: 2;
      column-gap: 1rem;
      max-width: 1100px; /* increase so 2 columns have room on bigger screens */
      width: 100%;
      column-fill: auto; /* attempt to distribute content predictably */
      /* outline: 1px dashed rgba(0,0,0,0.06);  <-- enable to debug container width */
    }

    @media (max-width: 1100px) {
      /* keeps two columns for medium screens, but switch to 1 at small widths */
      .grid {
        column-count: 2;
      }
    }

    @media (max-width: 768px) {
      .grid {
        column-count: 1;
      }
    }

    .card {
      background: #ffffff; /* white background */
      padding: 1rem 1.5rem;
      border-radius: 1rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.08);
      font-size: 1.1rem;
      color: #444;
      transition: transform 0.2s, box-shadow 0.2s;
      margin: 0 0 1rem 0;

      /* IMPORTANT: make cards behave properly inside columns */
      display: inline-block;           /* allow column flow */
      vertical-align: top;             /* avoid baseline spacing that can collapse columns */
      width: 100%;                     /* fill the column's width */
      box-sizing: border-box;          /* include padding in width */
      break-inside: avoid-column;      /* prevent splitting across columns */
      -webkit-column-break-inside: avoid;
      -moz-column-break-inside: avoid;
      page-break-inside: avoid;

      opacity: 0;
      animation: fadeIn 0.45s ease forwards;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .button {
      margin-top: 2rem;
      padding: 0.6rem 1.5rem;
      font-size: 1rem;
      background: #8b5cf6;
      color: white;
      border: none;
      border-radius: 1.5rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3);
      transition: background 0.2s;
      font-family: "Fira Sans", sans-serif;
      font-weight: 500;
    }

    .button:hover { background: #7c3aed; }

    .shuffle-button {
      position: fixed;
      top: 1rem;
      right: 1rem;
      padding: 0.6rem 1.2rem;
      font-size: 0.95rem;
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 1.5rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(34, 197, 94, 0.3);
      transition: background 0.2s;
      font-family: "Fira Sans", sans-serif;
      font-weight: 500;
      z-index: 1000;
    }

    .shuffle-button:hover { background: #16a34a; }

    @media (max-width: 500px) {
      .shuffle-button { position: static; margin-top: 1rem; }
    }
  </style>
</head>
<body>
  <h1>Hey, I'm Zin 👋</h1>
  <p class="intro">
    Welcome to my status archive! More on this site coming soon... (unless I procrastinate)
  </p>

  <div class="grid" id="statusGrid"></div>

  <button class="button" id="toggleButton">Expand</button>
  <button class="shuffle-button" id="shuffleButton">Shuffle</button>

  <script>
    const statuses = [
      "Mending a mirror of your own beliefs...",
      "Fulfilling the backwards lie...",
      "Providing a common enemy...",
      "Back in time...",
      "Restarting something that never stopped...",
      "When you don't want the horse to be dead...",
      "To create fiction you wish to be a reflection...",
      "The hardest thing you work for is regret…",
      "Peace is made, not found...",
      "The loudest thing you hear is your echo...",
      "When you don't want the horse to be dead…",
      "Pushing against yourself pushes others away...",
      "The greatest fight is against yourself...",
      "The existence of nothing is the hardest to accept...",
      "The smallest things that make you stop...",
      "The biggest change is the lack of something...",
      "The outlier is the one that wants others to follow...",
      "The length one goes through not to be underestimated...",
      "Changing is simply a matter of nuances...",
      "What defines a life worth living...",
      "Actions can have delayed responses...",
      "To wrong is not to be wronged against...",
      "All methods in which is impractical...",
      "Over the above under...",
      "The symbolism of symbols...",
      "Phophecy is not the epitome nor an epiphany...",
      "The perspectives of ethicality...",
      "People who see arent meant to be seen...",
      "To be someone who hasn't been themselves…"
    ];

    const grid = document.getElementById("statusGrid");
    const toggleButton = document.getElementById("toggleButton");
    const shuffleButton = document.getElementById("shuffleButton");
    let showAll = false;

    function shuffle(array) {
      // non-mutating shuffle: return a new shuffled copy
      const copy = array.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    let currentOrder = statuses.slice();

    function render() {
      grid.innerHTML = "";
      const visibleStatuses = showAll ? currentOrder : currentOrder.slice(0, 6);
      visibleStatuses.forEach((status, index) => {
        const card = document.createElement("div");
        card.className = "card";
        card.style.animationDelay = `${index * 0.05}s`;
        card.textContent = status;
        grid.appendChild(card);
      });
      toggleButton.textContent = showAll ? "Hide" : "Expand";
    }

    toggleButton.addEventListener("click", () => {
      showAll = !showAll;
      render();
    });

    shuffleButton.addEventListener("click", () => {
      currentOrder = shuffle(statuses);
      render();
    });

    // initialize
    currentOrder = shuffle(statuses);
    render();
  </script>
</body>
</html>
