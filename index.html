<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="webicon.png">
  <title>welcome to zin</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&display=swap');

    :root{
      --bg1: #f3e8ff;
      --bg2: #ffffff;
    }

    html,body { height: 100%; }
    body {
      margin: 0;
      font-family: "Fira Sans", sans-serif;
      font-weight: 500;
      background: linear-gradient(to bottom, var(--bg1), var(--bg2));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: bold;
      color: #333;
      margin: 0 0 0.5rem 0;
    }

    p.intro {
      max-width: 700px;
      text-align: center;
      font-size: 1.05rem;
      color: #555;
      margin: 0 0 1.5rem 0;
    }

    /* Two-column masonry with real column containers (no CSS columns) */
    .masonry {
      display: flex;
      gap: 1rem;
      max-width: 900px;
      width: 100%;
      align-items: flex-start;
    }

    .col {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-width: 0;
    }

    .card {
      background: #fff;
      padding: 1rem 1.5rem;
      border-radius: 1rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.08);
      font-size: 1.1rem;
      color: #444;
      transition: transform 0.18s, box-shadow 0.18s;
      width: 100%;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeIn 0.55s ease forwards;
      will-change: transform, opacity;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.12);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .controls {
      margin-top: 1.25rem;
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      background: #8b5cf6;
      color: white;
      border: none;
      border-radius: 1.25rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(139,92,246,0.25);
      transition: background 0.18s;
      font-weight: 500;
    }
    .button:hover { background: #7c3aed; }

    /* Fixed shuffle button */
    .shuffle-button {
      position: fixed;
      top: 1rem;
      right: 1rem;
      padding: 0.6rem 1.1rem;
      font-size: 0.95rem;
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 1.25rem;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(34,197,94,0.18);
      transition: transform 0.12s, background 0.12s;
      z-index: 9999;
      font-weight: 600;
    }
    .shuffle-button:active { transform: translateY(1px); }
    .shuffle-button:hover { background: #16a34a; }

    /* Responsive: single column on small screens */
    @media (max-width: 768px) {
      .masonry { flex-direction: column; }
      .col { width: 100%; }
    }
  </style>
</head>
<body>
  <h1>Hey, I'm Zin 👋</h1>
  <p class="intro">
    Welcome to my status archive! More on this site coming soon... (unless I procrastinate)
  </p>

  <div class="masonry" id="masonry">
    <div class="col" id="col1"></div>
    <div class="col" id="col2"></div>
  </div>

  <div class="controls">
    <button class="button" id="toggleButton">Expand</button>
  </div>

  <button class="shuffle-button" id="shuffleButton" aria-label="Shuffle statuses">Shuffle</button>

  <script>
    const statuses = [
      "Mending a mirror of your own beliefs...",
      "Fulfilling the backwards lie...",
      "Providing a common enemy...",
      "Back in time...",
      "Restarting something that never stopped...",
      "When you don't want the horse to be dead...",
      "To create fiction you wish to be a reflection...",
      "The hardest thing you work for is regret…",
      "Peace is made, not found...",
      "The loudest thing you hear is your echo...",
      "When you don't want the horse to be dead…",
      "Pushing against yourself pushes others away...",
      "The greatest fight is against yourself...",
      "The existence of nothing is the hardest to accept...",
      "The smallest things that make you stop...",
      "The biggest change is the lack of something...",
      "The outlier is the one that wants others to follow...",
      "The length one goes through not to be underestimated...",
      "Changing is simply a matter of nuances...",
      "What defines a life worth living...",
      "Actions can have delayed responses...",
      "To wrong is not to be wronged against...",
      "All methods in which is impractical...",
      "Over the above under...",
      "The symbolism of symbols...",
      "Phophecy is not the epitome nor an epiphany...",
      "The perspectives of ethicality...",
      "People who see arent meant to be seen...",
      "To be someone who hasn't been themselves…"
    ];

    const col1 = document.getElementById('col1');
    const col2 = document.getElementById('col2');
    const toggleButton = document.getElementById('toggleButton');
    const shuffleButton = document.getElementById('shuffleButton');
    let showAll = false;

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function clearCols() {
      col1.innerHTML = '';
      col2.innerHTML = '';
    }

    function render() {
      clearCols();
      const visibleStatuses = showAll ? statuses : statuses.slice(0, 6);

      // On small screens render single column in order for readable flow
      const singleColumn = window.innerWidth <= 768;

      visibleStatuses.forEach((status, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.textContent = status;

        // Fade by ROW: pair cards together (0+1 => row 0, 2+3 => row1, ...)
        const rowIndex = Math.floor(i / 2);
        const baseDelay = 0.06; // seconds
        card.style.animationDelay = `${rowIndex * baseDelay}s`;

        if (singleColumn) {
          col1.appendChild(card); // keep reading order on small screens
        } else {
          // alternate: even -> left, odd -> right (creates two-column masonry feel)
          if (i % 2 === 0) col1.appendChild(card);
          else col2.appendChild(card);
        }
      });

      toggleButton.textContent = showAll ? 'Hide' : 'Expand';
    }

    // handle window resize so single-column state updates on resize
    window.addEventListener('resize', () => {
      // re-render so layout & animation delays remain correct
      render();
    });

    toggleButton.addEventListener('click', () => {
      showAll = !showAll;
      render();
    });

    shuffleButton.addEventListener('click', () => {
      shuffle(statuses);
      render();
    });

    // initial shuffle + render
    shuffle(statuses);
    render();
  </script>
</body>
</html>
